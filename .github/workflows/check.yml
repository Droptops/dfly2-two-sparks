name: CPU checks and evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run CPU tests and verify published results
        run: python3 scripts/check.py
      - name: Reconstruct and verify pinned upstream sources
        run: |
          python3 scripts/prepare_source.py --destination "$RUNNER_TEMP/dfly2-sources"
          python3 scripts/prepare_source.py --check --destination "$RUNNER_TEMP/dfly2-sources"
